spring.config.import=optional:file:./local.properties

server.port=8080

# Enabling the H2-Console (local and remote)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# Password for the H2-Console
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# You can find your h2-console at: http://localhost:8080/h2-console/
# If you changed the server.port, you must also change it in the URL
# The credentials to log in to the h2 Driver are defined above. Be aware that the h2-console is only accessible when the server is running.

google.maps.api-key=${GOOGLE_MAPS_SERVER_API_KEY:}
google.maps.api-key-secret-version=${GOOGLE_MAPS_API_KEY_SECRET_VERSION:}
google.maps.elevation-endpoint=https://maps.googleapis.com/maps/api/elevation/json
google.maps.streetview-metadata-endpoint=https://maps.googleapis.com/maps/api/streetview/metadata
google.maps.timeout-ms=15000
google.maps.minimum-elevation-meters=1200
google.maps.streetview-radius-meters=2000
google.maps.max-attempts-per-region=5
google.maps.streetview-source=default
